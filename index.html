<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Operation REBIRTH</title>
  <!-- installable: "Add to Home Screen" opens the game full screen, including on iPhone -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0b0a14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="REBIRTH">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="preload" as="image" href="/assets/ui/loading-screen.png" fetchpriority="high">
  <!-- start fetching the pixel font right away (src/fonts/fonts.css declares it) -->
  <link rel="preload" href="./src/fonts/press-start-2p-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    :root { --bg: #0b0a14; --ink: #f0f2f3; --muted: #8a87a3; }
    @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --bg: #0b0a14; } }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; }
    body { display: flex; align-items: center; justify-content: center; font-family: 'Press Start 2P', monospace; }
    #game { width: 100vw; height: 100vh; }
    #game canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
    /* phones: no page scrolling, zooming or text selection while playing */
    html, body, #game, #game canvas { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; }
    #rotate { display: none; position: fixed; inset: 0; z-index: 10; background: var(--bg); color: var(--ink); align-items: center; justify-content: center; text-align: center; font-size: 12px; line-height: 2; padding: 24px; }
    @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
    #loading { position: fixed; inset: 0; z-index: 9; display: grid; place-items: center; background: #0b0912; pointer-events: none; opacity: 1; transition: opacity 180ms ease; }
    #loading.ready { opacity: 0; }
    .loading-art { position: relative; width: min(100vw, 177.7778vh); aspect-ratio: 16 / 9; }
    .loading-art img { display: block; width: 100%; height: 100%; image-rendering: pixelated; object-fit: contain; }
    .loading-progress { position: absolute; left: 27%; right: 27%; top: 90%; height: clamp(3px, .55vw, 8px); border: 1px solid #59476d; background: #181223; }
    #loading-fill { height: 100%; width: 0%; background: #dcd0ee; }
    #loading-percent { position: absolute; top: 93%; left: 0; right: 0; text-align: center; font: clamp(8px, 1.05vw, 15px) monospace; color: #dcd0ee; }
    @media (prefers-reduced-motion: reduce) { #loading { transition: none; } }
  </style>
</head>
<body>
  <div id="loading" aria-label="Loading Operation REBIRTH">
    <div class="loading-art">
      <img src="/assets/ui/loading-screen.png" width="1440" height="810" alt="Loading — Lacy, Mr Wake and Soul Summoner" fetchpriority="high">
      <div id="loading-progress" class="loading-progress" role="progressbar" aria-label="Game assets" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="loading-fill"></div></div>
      <span id="loading-percent" aria-hidden="true">0%</span>
    </div>
  </div>
  <div id="rotate">TURN YOUR PHONE SIDEWAYS<br>TO PLAY</div>
  <div id="game"></div>
  <script src="/loading-screens.js"></script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
